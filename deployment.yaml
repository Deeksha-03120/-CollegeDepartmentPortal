apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-department-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: college-department

  template:
    metadata:
      labels:
        app: college-department

    spec:
      containers:
        - name: college-department-container
          image: 24mis0129/college-department-portal:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: college-department-service

spec:
  type: NodePort

  selector:
    app: college-department

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30082